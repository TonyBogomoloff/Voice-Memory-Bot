name: Release Obsidian plugin
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate reviewed release assets
        run: python3 scripts/check_obsidian_package.py --tag "$GITHUB_REF_NAME"
      - name: Publish assets for mobile BRAT installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file plugins/obsidian/RELEASE.md \
            plugins/obsidian/dist/main.js plugins/obsidian/dist/manifest.json \
            plugins/obsidian/dist/styles.css plugins/obsidian/dist/voice-memory.zip
